name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install "numpy>=1.26" "Pillow>=10"

      - name: Install ffmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Compile maintained Python files on Ubuntu
        if: runner.os == 'Linux'
        run: python -m compileall -q src examples tools tests

      - name: Lint maintained code on Ubuntu
        if: runner.os == 'Linux'
        run: python -m ruff check tests tools

      - name: Run pytest on Ubuntu
        if: runner.os == 'Linux'
        run: python -m pytest -q

      - name: Full system health on Ubuntu
        if: runner.os == 'Linux'
        run: python src/system_health.py

      - name: Canonical Windows development gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev_check.ps1
